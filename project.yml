name: StartupStudio

options:
  bundleIdPrefix: com.alpsenel
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

packages:
  TycoonEngine:
    path: Packages/TycoonEngine
  TycoonContent:
    path: Packages/TycoonContent
  TycoonSave:
    path: Packages/TycoonSave
  PixelKit:
    path: Packages/PixelKit

targets:
  StartupStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: TycoonEngine
        product: TycoonEngine
      - package: TycoonContent
        product: TycoonContent
      - package: TycoonSave
        product: TycoonSave
      - package: PixelKit
        product: PixelKit
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Startup Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Iteration 7 (R8): the iPad is the phone layout in a centred
        # column, not a second design. Requiring full screen means the
        # app is never asked for a multitasking size, so portrait-only
        # holds there too (Split View demands all four orientations).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: true
        # Iteration 7 (R8): the store listing's own keys.
        LSApplicationCategoryType: public.app-category.simulation-games
        NSHumanReadableCopyright: Copyright © 2026 Alp Senel. All rights reserved.
        # Iteration 7 (R4): a share card's code opens the app on the custom page.
        CFBundleURLTypes:
          - CFBundleURLName: com.alpsenel.startupstudio.seed
            CFBundleURLSchemes:
              - startupstudio
        # Iteration 7 (R8): no encryption beyond the OS's own — answers
        # export compliance at upload.
        ITSAppUsesNonExemptEncryption: false
    # Iteration 7: iCloud key-value storage (R2) and Game Center (R3).
    # KVS needs no container; the App ID needs both capabilities ticked.
    #
    # R6: the two entitlements files are committed, not generated. Xcode
    # signs Debug with App/StartupStudio.debug.entitlements — the same
    # keys plus `get-task-allow`, which storekitd needs before it serves
    # StoreKitTest's SKTestSession to an app launched by `xcodebuild test`
    # ("is not installed for development" otherwise; Xcode's own Run adds
    # it another way) — and Release with App/StartupStudio.entitlements,
    # so an archive never carries it. Add any new key to both files.
    # (XcodeGen's `entitlements:` block writes CODE_SIGN_ENTITLEMENTS
    # after the per-config settings, which is why it is not used here.)
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: App/StartupStudio.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.alpsenel.startupstudio
        DEVELOPMENT_TEAM: 6S7Q8F967Q
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        # CURRENT_PROJECT_VERSION is NOT set here on purpose: a target
        # setting beats an xcconfig, and the build number comes from
        # App/Config/Version.xcconfig, which `make gen` rewrites from
        # `git rev-list --count HEAD`.
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        # Iteration 7 (R8): iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: App/StartupStudio.debug.entitlements
        Release:
          # R8: the screenshot fixtures (App/Resources/Fixtures) are DEBUG
          # data for `-autoFixture`. This keeps them out of the shipped
          # bundle — Xcode filters build-phase inputs by these globs.
          EXCLUDED_SOURCE_FILE_NAMES: "release-*.json"
    # The build number, rewritten by `make gen` from the commit count.
    # An xcconfig because xcodegen cannot shell out and the number must
    # not be hand-edited before every upload.
    configFiles:
      Debug: App/Config/Version.xcconfig
      Release: App/Config/Version.xcconfig
    scheme:
      configVariants: []
      # Iteration 7 (R6): the one product, for simulator purchases. Never
      # part of a release build — it is a scheme setting, not a resource.
      storeKitConfiguration: App/StoreKit/StartupStudio.storekit
      testTargets:
        - StartupStudioTests

  # Unit tests for the App layer: the weekly report's reconciliation with
  # the ledger, the router, the event copy's coverage of every GameEvent,
  # the bitmap font, and the game calendar. Run with:
  #   make apptest
  StartupStudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/Tests
      # Iteration 7 (R6): the StoreKit configuration rides in the test
      # bundle so `SKTestSession` can load it; it is never in the app.
      - path: App/StoreKit
        buildPhase: resources
    dependencies:
      - target: StartupStudio
      - sdk: StoreKitTest.framework
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alpsenel.startupstudio.tests
